desc: 机器人答应「明天提醒你」「我去睡了」，转头就忘、说完接着聊。插件从它自己说出去的话里认出答应了什么：到点用它自己的口吻去做（群里 @ 那个人），说了去睡 / 潜水 / 不理你就真的做到、有人一直叫才醒，没做成的下次告诉它欠着。细节和配置见 README。
short_desc: 答应了就到点去做，说去睡就真去睡
